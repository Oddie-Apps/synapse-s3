name: Build and Push Synapse + S3 Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "s3_storage_provider.py"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      synapse_version:
        description: "Upstream Synapse version (e.g., v1.151.0)"
        required: true
        default: "v1.151.0"
  schedule:
    # Weekly poll: every Monday at 06:00 UTC. Detects new upstream Synapse
    # releases and rebuilds.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine Synapse version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.synapse_version }}" ]; then
            VERSION="${{ github.event.inputs.synapse_version }}"
          else
            # Pull latest stable from upstream
            VERSION=$(curl -sL "https://api.github.com/repos/element-hq/synapse/releases/latest" | jq -r .tag_name)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building synapse-s3 against Synapse ${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            SYNAPSE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/oddie-apps/synapse-s3:${{ steps.version.outputs.version }}
            ghcr.io/oddie-apps/synapse-s3:${{ steps.version.outputs.version }}-${{ github.sha }}
            ghcr.io/oddie-apps/synapse-s3:latest
          labels: |
            org.opencontainers.image.source=https://github.com/oddie-apps/synapse-s3
            org.opencontainers.image.description=Synapse + synapse-s3-storage-provider
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
